<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopala | Moda e estilo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            letter-spacing: 2px;
        }

        header p {
            margin-top: 6px;
            font-size: 14px;
        }

        .hero {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }

        .hero h2 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 17px;
            color: #555;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #111;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .products {
            padding: 40px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 200px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            margin-bottom: 15px;
        }

        .product h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>SHOPALA</h1>
    <p>Moda, estilo e qualidade</p>
</header>

<section class="hero">
    <h2>Seu estilo começa aqui.</h2>
    <p>Conheça nossa coleção e encontre seu próximo look.</p>
    <a href="#produtos" class="button">Ver produtos</a>
</section>

<section class="products" id="produtos">

    <h2>Produtos em destaque</h2>

    <div class="grid">

        <div class="product">
            <div class="product-image">
                Foto do produto
            </div>

            <h3>Camiseta básica</h3>

            <div class="price">
                R$ 49,90
            </div>

            <a href="#" class="button">
                Comprar
            </a>
        </div>

        <div class="product">
            <div class="product-image">
                Foto do produto
            </div>

            <h3>Camiseta Premium</h3>

            <div class="price">
                R$ 59,90
            </div>

            <a href="#" class="button">
                Comprar
            </a>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Shopala — Todos os direitos reservados.</p>
</footer>

</body>
</html>
